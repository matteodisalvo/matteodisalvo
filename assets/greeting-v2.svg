<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="105" viewBox="0 0 1000 105" role="img" aria-labelledby="greeting-title greeting-desc">
  <title id="greeting-title">A multilingual greeting from Matteo</title>
  <desc id="greeting-desc">A clean typewriter animation cycling through Ciao, Hello, Hola, Salut, and Hallo.</desc>

