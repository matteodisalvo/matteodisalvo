<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-labelledby="greeting-title greeting-desc">
  <title id="greeting-title">A multilingual greeting from Matteo</title>
  <desc id="greeting-desc">A typewriter animation cycling through Ciao, Hello, Hola, Salut, and Hallo.</desc>

  <defs>
    <linearGradient id="panel" x1="150" y1="12" x2="850" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FCFF"/>
      <stop offset="0.55" stop-color="#E7F5FF"/>
      <stop offset="1" stop-color="#EEE9FF"/>
    </linearGradient>
    <linearGradient id="border" x1="170" y1="20" x2="830" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50C9F5"/>
      <stop offset="0.52" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#55D6A8"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#5B82A6" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173A5E" flood-opacity="0.18"/>
    </filter>

    <clipPath id="clip-it" clipPathUnits="userSpaceOnUse">
      <rect class="clip-it" x="335" y="48" width="0" height="50">
        <animate attributeName="width" values="0;26;52;78;104;130;156;182;205;205;182;156;130;104;78;52;26;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
    <clipPath id="clip-en" clipPathUnits="userSpaceOnUse">
      <rect x="335" y="48" width="0" height="50">
        <animate attributeName="width" values="0;29;58;87;116;145;174;203;232;232;203;174;145;116;87;58;29;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
    <clipPath id="clip-es" clipPathUnits="userSpaceOnUse">
      <rect x="335" y="48" width="0" height="50">
        <animate attributeName="width" values="0;29;58;87;116;145;174;203;232;232;203;174;145;116;87;58;29;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
    <clipPath id="clip-fr" clipPathUnits="userSpaceOnUse">
      <rect x="335" y="48" width="0" height="50">
        <animate attributeName="width" values="0;32;64;96;128;160;192;224;258;258;224;192;160;128;96;64;32;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
    <clipPath id="clip-de" clipPathUnits="userSpaceOnUse">
      <rect x="335" y="48" width="0" height="50">
        <animate attributeName="width" values="0;29;58;87;116;145;174;203;232;232;203;174;145;116;87;58;29;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Apple Color Emoji", "Segoe UI Emoji", monospace; }
      .lang { opacity: 0; }
      .it { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .lang { opacity: 0 !important; }
        .lang.it { opacity: 1 !important; }
        .cursor { display: none !important; }
        .clip-it { width: 205px !important; }
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="150" y="12" width="700" height="106" rx="24" fill="url(#panel)" stroke="url(#border)" stroke-width="2"/>
    <rect x="151" y="13" width="698" height="104" rx="23" fill="url(#grid)"/>
  </g>

  <path d="M168 39V27H180M820 27H832V39M168 91V103H180M820 103H832V91" fill="none" stroke="#4FAED5" stroke-width="3"/>
  <circle cx="186" cy="31" r="4" fill="#44CE98">
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="199" y="36" class="mono" fill="#52708E" font-size="13" font-weight="700" letter-spacing="1.4">GREETING_PROTOCOL // MULTILINGUAL</text>
  <text x="816" y="36" class="mono" text-anchor="end" fill="#6C7F99" font-size="12">AUTO_LOOP: 20s</text>
  <text x="294" y="86" class="mono" fill="#309BC8" font-size="42" font-weight="800">&gt;</text>

  <g class="lang it">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.1999;.2;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="335" y="86" class="mono" clip-path="url(#clip-it)" fill="#0C2A48" font-size="44" font-weight="800">Ciao! 👋</text>
    <rect class="cursor" x="335" y="52" width="5" height="39" rx="1" fill="#176E9A">
      <animate attributeName="x" values="335;361;387;413;439;465;491;517;540;540;517;491;465;439;413;387;361;335;335" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="738" y="55" width="72" height="37" rx="10" fill="#D6F3FF" stroke="#52BDE8"/>
    <text x="774" y="80" class="mono" text-anchor="middle" fill="#176E9A" font-size="18" font-weight="800">IT</text>
  </g>

  <g class="lang en">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.1999;.2;.3999;.4;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="335" y="86" class="mono" clip-path="url(#clip-en)" fill="#0C2A48" font-size="44" font-weight="800">Hello! 👋</text>
    <rect class="cursor" x="335" y="52" width="5" height="39" rx="1" fill="#7655D5">
      <animate attributeName="x" values="335;364;393;422;451;480;509;538;567;567;538;509;480;451;422;393;364;335;335" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="738" y="55" width="72" height="37" rx="10" fill="#E9E1FF" stroke="#957DE8"/>
    <text x="774" y="80" class="mono" text-anchor="middle" fill="#6848C2" font-size="18" font-weight="800">EN</text>
  </g>

  <g class="lang es">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.3999;.4;.5999;.6;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="335" y="86" class="mono" clip-path="url(#clip-es)" fill="#0C2A48" font-size="44" font-weight="800">¡Hola! 👋</text>
    <rect class="cursor" x="335" y="52" width="5" height="39" rx="1" fill="#199B72">
      <animate attributeName="x" values="335;364;393;422;451;480;509;538;567;567;538;509;480;451;422;393;364;335;335" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="738" y="55" width="72" height="37" rx="10" fill="#DFF8EE" stroke="#55CFA4"/>
    <text x="774" y="80" class="mono" text-anchor="middle" fill="#16845F" font-size="18" font-weight="800">ES</text>
  </g>

  <g class="lang fr">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5999;.6;.7999;.8;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="335" y="86" class="mono" clip-path="url(#clip-fr)" fill="#0C2A48" font-size="44" font-weight="800">Salut ! 👋</text>
    <rect class="cursor" x="335" y="52" width="5" height="39" rx="1" fill="#D48532">
      <animate attributeName="x" values="335;367;399;431;463;495;527;559;593;593;559;527;495;463;431;399;367;335;335" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="738" y="55" width="72" height="37" rx="10" fill="#FFF0D9" stroke="#F0B56A"/>
    <text x="774" y="80" class="mono" text-anchor="middle" fill="#A9661D" font-size="18" font-weight="800">FR</text>
  </g>

  <g class="lang de">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.7999;.8;.9999;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="335" y="86" class="mono" clip-path="url(#clip-de)" fill="#0C2A48" font-size="44" font-weight="800">Hallo! 👋</text>
    <rect class="cursor" x="335" y="52" width="5" height="39" rx="1" fill="#D25E84">
      <animate attributeName="x" values="335;364;393;422;451;480;509;538;567;567;538;509;480;451;422;393;364;335;335" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="738" y="55" width="72" height="37" rx="10" fill="#FFE4EE" stroke="#E680A1"/>
    <text x="774" y="80" class="mono" text-anchor="middle" fill="#AD3E64" font-size="18" font-weight="800">DE</text>
  </g>
</svg>
