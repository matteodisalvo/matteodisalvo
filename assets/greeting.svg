      </rect>
    </clipPath>
    <clipPath id="clip-fr" clipPathUnits="userSpaceOnUse">
      <rect x="375" y="20" width="0" height="64">
        <animate attributeName="width" values="0;32;64;96;128;160;192;224;258;258;224;192;160;128;96;64;32;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>
    <clipPath id="clip-de" clipPathUnits="userSpaceOnUse">
      <rect x="375" y="20" width="0" height="64">
        <animate attributeName="width" values="0;29;58;87;116;145;174;203;232;232;203;174;145;116;87;58;29;0;0" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </clipPath>

    <style>
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 50px; font-weight: 800; }
      .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 44px; }
      .lang { opacity: 0; }
      .it { opacity: 1; }
      @media (prefers-color-scheme: dark) { .shadow { stroke: #D7EDFF; } }
      @media (prefers-reduced-motion: reduce) {
        .lang { opacity: 0 !important; }
        .lang.it { opacity: 1 !important; }
        .cursor { display: none !important; }
        .clip-it { width: 205px !important; }
      }
    </style>
  </defs>

  <path class="shadow" d="M365 91H635" stroke="#D4E8F5" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <g class="lang it">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.1999;.2;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="375" y="70" class="text" clip-path="url(#clip-it)" fill="url(#ink)">Ciao!</text>
    <text x="535" y="70" class="emoji">👋
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.239;.24;.62;.621;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <rect class="cursor" x="375" y="26" width="5" height="50" rx="2" fill="#168DBB">
      <animate attributeName="x" values="375;401;427;453;479;505;531;557;580;580;557;531;505;479;453;427;401;375;375" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="lang en">
