      <animate attributeName="x" values="375;404;433;462;491;520;549;578;607;607;578;549;520;491;462;433;404;375;375" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="lang fr">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5999;.6;.7999;.8;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="375" y="70" class="text" clip-path="url(#clip-fr)" fill="url(#ink)">Salut !</text>
    <text x="595" y="70" class="emoji">👋
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.239;.24;.62;.621;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <rect class="cursor" x="375" y="26" width="5" height="50" rx="2" fill="#C87C2B">
      <animate attributeName="x" values="375;407;439;471;503;535;567;599;633;633;599;567;535;503;471;439;407;375;375" keyTimes="0;.03;.06;.09;.12;.15;.18;.21;.24;.62;.67;.71;.75;.79;.83;.87;.91;.95;1" dur="4s" repeatCount="indefinite" calcMode="discrete"/>
      <animate attributeName="opacity" values="1;0;1" dur=".72s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="lang de">
